<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Steady</title>
  <meta name="description" content="Training plan, meal plan and a food, water and effort log that works offline.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Steady">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="modulepreload" href="icons.js">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="app.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header id="navbar" class="navbar" aria-hidden="true"><span id="navbar-title"></span></header>
  <main id="main" tabindex="-1"></main>
  <nav class="tabs" aria-label="Sections">
    <button type="button" data-act="tab" data-tab="today">Today</button>
    <button type="button" data-act="tab" data-tab="train">Train</button>
    <button type="button" data-act="tab" data-tab="food">Food</button>
    <button type="button" data-act="tab" data-tab="progress">Progress</button>
    <button type="button" data-act="tab" data-tab="more">More</button>
  </nav>
  <dialog id="sheet" aria-labelledby="sheet-title"></dialog>
  <div id="update" class="update" role="status" hidden><span>A new version of Steady is ready.</span><button type="button" class="btn small" data-act="update-now">Update</button></div>
  <div id="flash" class="flash" role="alert" data-act="flash-hide" hidden></div>
  <div id="tip" role="status" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>Steady needs JavaScript turned on.</noscript>
</body>
</html>
